spring.application.name=poker_project
spring.config.import=optional:file:.env[.properties]
server.port=8081

spring.datasource.url=jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

google.oauth.client-id=${GOOGLE_CLIENT_ID}

# Comma-separated list of origins allowed to call the API / open WebSocket
# connections. Covers both the Angular CLI's default dev port (4200) and
# 4300 (used throughout local testing this session) so `ng serve` works
# either way out of the box. Override via CORS_ALLOWED_ORIGINS in
# production (e.g. https://your-frontend-domain.com).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:4300,http://127.0.0.1:4300}

# Base WebSocket URL handed back to clients in PlayResponse. Override via
# APP_WS_URL in production (e.g. wss://your-backend-domain.com/ws).
app.ws-url=${APP_WS_URL:ws://localhost:8081/ws}
