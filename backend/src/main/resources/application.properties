spring.application.name=poker_project
spring.config.import=optional:file:.env[.properties]
# Render (and most PaaS hosts) inject PORT at runtime; default to 8081 locally.
server.port=${PORT:8081}

spring.datasource.url=jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Off by default: every chip update/leaderboard query was being printed to
# stdout in production. Set JPA_SHOW_SQL=true locally when debugging queries.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Open-session-in-view (Spring Boot's default) keeps a request's first pooled
# connection checked out until the response is written — including while
# /game/play or /game/rebuy waits on a lobby lock. With only 5 connections,
# a burst of such requests starves the lock holder's own cash-out write
# (leaveTable -> depositToBank), stalling the table for the pool timeout and
# failing the cash-out. Nothing here lazy-loads (PlayerRecord has no
# associations), so each repository call can use its own short transaction.
spring.jpa.open-in-view=false

# Supabase's session-mode pooler caps total concurrent connections at 15
# across everything connected to this database. HikariCP's 10-connection
# default leaves almost no headroom for a redeploy's old/new instance
# overlap, so this single instance is capped well below the DB's ceiling.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

google.oauth.client-id=${GOOGLE_CLIENT_ID}

# Comma-separated list of origins allowed to call the API / open WebSocket
# connections. Covers both the Angular CLI's default dev port (4200) and
# 4300 (used throughout local testing this session) so `ng serve` works
# either way out of the box. Override via CORS_ALLOWED_ORIGINS in
# production (e.g. https://your-frontend-domain.com).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:4300,http://127.0.0.1:4300}

# Base WebSocket URL handed back to clients in PlayResponse. Override via
# APP_WS_URL in production (e.g. wss://your-backend-domain.com/ws).
app.ws-url=${APP_WS_URL:ws://localhost:8081/ws}
